<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TaskHub - Login com GitHub</title>
</head>
<body>
    {% if user_data %}
        <h1>Bem-vindo, {{ user_data.login }}!</h1>
        <p><strong>Token:</strong> {{ user_data.token }}</p>
        <a href="/logout/"><button>Logout</button></a>
    {% else %}
        <h1>TaskHub</h1>
        <p>Faça login para continuar:</p>
        <a href="/auth/login/"><button>Login com GitHub</button></a>
    {% endif %}
</body>
</html>
